name: CI y publicación

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    # Trusted Publishing: la política del Marketplace exige este environment, que solo admite tags v*
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: El tag coincide con la versión de package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: El tag apunta a un commit de main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - run: npx vsce package -o extension.vsix
      - name: Publicar en el Marketplace
        run: npx vsce publish --oidc --packagePath extension.vsix
      - name: Publicar en Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish extension.vsix
